name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'LICENSE.zh-TW.md'
      - '.gitignore'
      - '.gcloudignore'
      - '.cursor/**'
      - '.vscode/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
        run: npx prisma generate

      - name: Typecheck / compile
        run: npm run build
