name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'LICENSE.zh-TW.md'
      - '.gitignore'
      - '.gcloudignore'
      - '.cursor/**'
      - '.vscode/**'

# Deploy model
#   GitHub Variables : where to deploy (project, region, service, Cloud SQL, DB name/user).
#   GitHub Secrets   : GCP_SA_KEY only (deploy identity).
#   Secret Manager   : every credential, bound below via `secrets:` (see docs/SECRETS.md).
#   Cloud Run service: all other runtime config (ALLOWED_ORIGINS, WEBAUTHN_*, partner
#                      URLs/IDs). `gcloud run deploy --image` keeps it between deploys;
#                      change it with `gcloud run services update --update-env-vars`.
# Secrets listed under `secrets:` must exist in Secret Manager
# (infra/gcp-migration/50-secret-manager.sh creates them from a running service).
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE }}
  DB_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE }}
  DB_USER: ${{ vars.DB_USER }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_SCHEMA: ${{ vars.DB_SCHEMA || 'public' }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Check required deploy config
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "Missing $1 — set a GitHub Variable (or Secret fallback where documented)"
              missing=1
            fi
          }
          check GCP_PROJECT_ID "$PROJECT_ID"
          check GCP_REGION "$REGION"
          check CLOUD_RUN_SERVICE "$SERVICE_NAME"
          check CLOUD_SQL_INSTANCE "$DB_INSTANCE_NAME"
          check DB_USER "$DB_USER"
          check DB_NAME "$DB_NAME"
          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.0

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: |
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project "$PROJECT_ID")"
          export DB_PASSWORD
          curl -fsSL -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.DB_INSTANCE_NAME }} --port 5432 &
          PROXY_PID=$!
          trap "kill $PROXY_PID" EXIT
          sleep 5

          DB_PASSWORD_ENCODED=$(node -e "console.log(encodeURIComponent(process.env.DB_PASSWORD || ''))")
          export DATABASE_URL="postgresql://${{ env.DB_USER }}:${DB_PASSWORD_ENCODED}@127.0.0.1:5432/${{ env.DB_NAME }}?schema=${{ env.DB_SCHEMA }}"
          npx prisma migrate resolve --rolled-back 20260616000000_plaid_cache_item_cascade || true
          npx prisma migrate deploy

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Push image to Google Container Registry
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --add-cloudsql-instances=${{ env.DB_INSTANCE_NAME }} --allow-unauthenticated --port=8080 --memory=512Mi --cpu=1 --timeout=3600
          # Only the DB wiring is managed here; everything else stays on the service.
          env_vars: |-
            NODE_ENV=production
            DB_HOST=/cloudsql/${{ env.DB_INSTANCE_NAME }}
            DB_PORT=5432
            DB_USER=${{ env.DB_USER }}
            DB_NAME=${{ env.DB_NAME }}
            DB_SCHEMA=${{ env.DB_SCHEMA }}
          # Credentials come from Secret Manager (secret name = env var name).
          # Trim to the domains enabled in src/config/features.ts.
          secrets: |-
            DB_PASSWORD=DB_PASSWORD:latest
            JWT_SECRET=JWT_SECRET:latest
            ENCRYPTION_KEY=ENCRYPTION_KEY:latest
            PRIVY_APP_ID=PRIVY_APP_ID:latest
            PRIVY_APP_SECRET=PRIVY_APP_SECRET:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            PLAID_CLIENT_ID=PLAID_CLIENT_ID:latest
            PLAID_SANDBOX_SECRET=PLAID_SANDBOX_SECRET:latest
            PLAID_PRODUCTION_SECRET=PLAID_PRODUCTION_SECRET:latest
            DEBANK_ACCESS_KEY=DEBANK_ACCESS_KEY:latest
            STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest
            STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest
            BRIDGE_API_KEY=BRIDGE_API_KEY:latest
            BRIDGE_WEBHOOK_PUBLIC_KEY=BRIDGE_WEBHOOK_PUBLIC_KEY:latest
            DINARI_API_KEY_ID=DINARI_API_KEY_ID:latest
            DINARI_API_SECRET_KEY=DINARI_API_SECRET_KEY:latest
            LOGO_DEV_TOKEN=LOGO_DEV_TOKEN:latest

      - name: Verify Cloud Run deployment
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy successful
        if: success()
        run: |
          echo "✅ Successfully deployed to Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Project: ${{ env.PROJECT_ID }}"
          echo "Image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      - name: Deploy failed
        if: failure()
        run: echo "❌ Deployment failed"
