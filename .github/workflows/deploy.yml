name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - develop

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: kura-backend
  DB_INSTANCE_NAME: kura-492622:us-central1:kura-postgres
  DB_USER: kura_user
  DB_NAME: kura_db
  DB_SCHEMA: public

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      # 步驟 1: 檢出代碼
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      # 步驟 2: 認證 Google Cloud (使用 Service Account Key)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 步驟 3: 設置 Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.0

      # 步驟 4: 設置 Docker 認證
      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker

      # 步驟 5: 設置 Node.js（用於執行 Prisma migration）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 步驟 6: 安裝依賴（migration 需要 Prisma CLI）
      - name: Install dependencies
        run: npm ci

      # 步驟 7: 執行 Prisma migration（透過 Cloud SQL Proxy）
      - name: Run Prisma migrations
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          curl -fsSL -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.DB_INSTANCE_NAME }} --port 5432 &
          PROXY_PID=$!
          trap "kill $PROXY_PID" EXIT
          sleep 5

          DB_PASSWORD_ENCODED=$(node -e "console.log(encodeURIComponent(process.env.DB_PASSWORD || ''))")
          export DATABASE_URL="postgresql://${{ env.DB_USER }}:${DB_PASSWORD_ENCODED}@127.0.0.1:5432/${{ env.DB_NAME }}?schema=${{ env.DB_SCHEMA }}"
          # 清除上次失敗留下的 failed migration 記錄（幂等：無 failed 記錄時為 no-op）
          npx prisma migrate resolve --rolled-back 20260616000000_plaid_cache_item_cascade || true
          npx prisma migrate deploy

      # 步驟 8: 構建 Docker 鏡像
      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            .

      # 步驟 9: 推送鏡像到 Google Container Registry
      - name: Push image to Google Container Registry
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

      # 步驟 10: 部署到 Cloud Run (參考 saori 的做法)
      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --add-cloudsql-instances=${{ env.DB_INSTANCE_NAME }} --allow-unauthenticated --port=8080 --memory=512Mi --cpu=1 --timeout=3600
          env_vars: |-
            NODE_ENV=production
            DB_HOST=/cloudsql/${{ env.DB_INSTANCE_NAME }}
            DB_PORT=5432
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ env.DB_NAME }}
            DB_SCHEMA=${{ env.DB_SCHEMA }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID }}
            PLAID_PRODUCTION_SECRET=${{ secrets.PLAID_PRODUCTION_SECRET }}
            PLAID_REDIRECT_URI=${{ secrets.PLAID_REDIRECT_URI }}
            PLAID_WEBHOOK_URL=${{ secrets.PLAID_WEBHOOK_URL }}
            LOGO_DEV_TOKEN=${{ secrets.LOGO_DEV_PUBLISHABLE_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            APP_NAME=${{ secrets.APP_NAME }}
            APP_URL=${{ secrets.APP_URL }}
            DEBANK_ACCESS_KEY=${{ secrets.DEBANK_ACCESS_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PRICE_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
            STRIPE_PRICE_PRO_YEARLY=${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
            STRIPE_PRICE_ULTIMATE_MONTHLY=${{ secrets.STRIPE_PRICE_ULTIMATE_MONTHLY }}
            STRIPE_PRICE_ULTIMATE_YEARLY=${{ secrets.STRIPE_PRICE_ULTIMATE_YEARLY }}
            BRIDGE_API_KEY=${{ secrets.BRIDGE_API_KEY }}
            BRIDGE_WEBHOOK_PUBLIC_KEY=${{ secrets.BRIDGE_WEBHOOK_PUBLIC_KEY }}
            BRIDGE_FEE_CONFIG_ENABLED=${{ vars.BRIDGE_FEE_CONFIG_ENABLED }}
            DINARI_API_KEY_ID=${{ secrets.DINARI_API_KEY_ID }}
            DINARI_API_SECRET_KEY=${{ secrets.DINARI_API_SECRET_KEY }}
            DINARI_ENVIRONMENT=sandbox
            DINARI_CHAIN_ID=eip155:8453
            PRIVY_APP_ID=${{ secrets.PRIVY_APP_ID }}
            PRIVY_APP_SECRET=${{ secrets.PRIVY_APP_SECRET }}
            PRIVY_VERIFICATION_KEY=${{ secrets.PRIVY_VERIFICATION_KEY }}
            LIFI_INTEGRATOR=kura,Kura
            LIFI_API_KEY=${{ secrets.LIFI_API_KEY }}
            WEBAUTHN_RP_ID=api.kura-finance.com
            WEBAUTHN_RP_NAME=Kura
            WEBAUTHN_ORIGIN=https://api.kura-finance.com\,android:apk-key-hash:MePOeO1vVaYsQDTyYfKRQy2-RHSgZxcCC4ifchmuu6A

      # Optional env (add to env_vars above when set — see docs/ENVIRONMENT.md):
      # ADMIN_EMAIL, SUPPORT_EMAIL, PLAID_SANDBOX_USER_IDS,
      # DINARI_WHITELIST_DOMAINS, DINARI_WHITELIST_EMAILS,
      # APPLE_APP_ID, ANDROID_PACKAGE_NAME, ANDROID_SHA256_CERT_FINGERPRINTS
      # Secrets tips (first deploy):
      # ALLOWED_ORIGINS: "https://app.kura-finance.com,https://www.kura-finance.com,https://kura-finance.com"
      # PLAID_REDIRECT_URI: "https://app.kura-finance.com/dashboard"
      # APP_URL: "https://app.kura-finance.com"
      # BRIDGE_WEBHOOK_PUBLIC_KEY: PEM from Bridge dashboard (use \n for newlines in secret)

      # 步驟 11: 驗證部署
      - name: Verify Cloud Run deployment
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # 步驟 12: 部署成功通知
      - name: Deploy successful
        if: success()
        run: |
          echo "✅ Successfully deployed to Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Project: ${{ env.PROJECT_ID }}"
          echo "Image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      # 步驟 13: 部署失敗通知
      - name: Deploy failed
        if: failure()
        run: echo "❌ Deployment failed"
