name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'LICENSE.zh-TW.md'
      - '.gitignore'
      - '.gcloudignore'
      - '.cursor/**'
      - '.vscode/**'

# Infra / public config: GitHub Variables (never hardcode production IDs here).
# Credentials: GitHub Secrets.
# `vars.X || secrets.X` keeps working until a Secret is copied to a Variable.
#
# Required Variables: GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE,
#   CLOUD_SQL_INSTANCE, DB_USER, DB_NAME, DB_SCHEMA, ALLOWED_ORIGINS,
#   WEBAUTHN_RP_ID, WEBAUTHN_RP_NAME, WEBAUTHN_ORIGIN, WEBAUTHN_RELATED_ORIGINS
# Optional Variables: ADMIN_EMAIL, LIFI_INTEGRATOR, DINARI_ENVIRONMENT,
#   DINARI_CHAIN_ID, APPLE_APP_ID, ANDROID_PACKAGE_NAME,
#   ANDROID_SHA256_CERT_FINGERPRINTS
# Partner env_vars below match FEATURES in src/config/features.ts.
# Enable a domain there, then add its lines here (see docs/SECRETS.md).
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE }}
  DB_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE }}
  DB_USER: ${{ vars.DB_USER }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_SCHEMA: ${{ vars.DB_SCHEMA || 'public' }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Check required deploy config
        env:
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "Missing $1 — set a GitHub Variable (or Secret fallback where documented)"
              missing=1
            fi
          }
          check GCP_PROJECT_ID "$PROJECT_ID"
          check GCP_REGION "$REGION"
          check CLOUD_RUN_SERVICE "$SERVICE_NAME"
          check CLOUD_SQL_INSTANCE "$DB_INSTANCE_NAME"
          check DB_USER "$DB_USER"
          check DB_NAME "$DB_NAME"
          check WEBAUTHN_RP_ID "$WEBAUTHN_RP_ID"
          check WEBAUTHN_ORIGIN "$WEBAUTHN_ORIGIN"
          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.0

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          curl -fsSL -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.DB_INSTANCE_NAME }} --port 5432 &
          PROXY_PID=$!
          trap "kill $PROXY_PID" EXIT
          sleep 5

          DB_PASSWORD_ENCODED=$(node -e "console.log(encodeURIComponent(process.env.DB_PASSWORD || ''))")
          export DATABASE_URL="postgresql://${{ env.DB_USER }}:${DB_PASSWORD_ENCODED}@127.0.0.1:5432/${{ env.DB_NAME }}?schema=${{ env.DB_SCHEMA }}"
          npx prisma migrate resolve --rolled-back 20260616000000_plaid_cache_item_cascade || true
          npx prisma migrate deploy

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Push image to Google Container Registry
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

      # gcloud --set-env-vars is comma-separated; escape commas in CSV values.
      - name: Escape comma-separated Cloud Run values
        env:
          ALLOWED_ORIGINS_RAW: ${{ vars.ALLOWED_ORIGINS || secrets.ALLOWED_ORIGINS }}
          WEBAUTHN_ORIGIN_RAW: ${{ vars.WEBAUTHN_ORIGIN }}
          WEBAUTHN_RELATED_ORIGINS_RAW: ${{ vars.WEBAUTHN_RELATED_ORIGINS }}
          LIFI_INTEGRATOR_RAW: ${{ vars.LIFI_INTEGRATOR }}
        run: |
          escape() { printf '%s' "$1" | sed 's/,/\\,/g'; }
          {
            echo "ALLOWED_ORIGINS_ESC=$(escape "$ALLOWED_ORIGINS_RAW")"
            echo "WEBAUTHN_ORIGIN_ESC=$(escape "$WEBAUTHN_ORIGIN_RAW")"
            echo "WEBAUTHN_RELATED_ORIGINS_ESC=$(escape "$WEBAUTHN_RELATED_ORIGINS_RAW")"
            echo "LIFI_INTEGRATOR_ESC=$(escape "$LIFI_INTEGRATOR_RAW")"
          } >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --add-cloudsql-instances=${{ env.DB_INSTANCE_NAME }} --allow-unauthenticated --port=8080 --memory=512Mi --cpu=1 --timeout=3600
          env_vars: |-
            NODE_ENV=production
            DB_HOST=/cloudsql/${{ env.DB_INSTANCE_NAME }}
            DB_PORT=5432
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ env.DB_NAME }}
            DB_SCHEMA=${{ env.DB_SCHEMA }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS_ESC }}
            PRIVY_APP_ID=${{ secrets.PRIVY_APP_ID }}
            PRIVY_APP_SECRET=${{ secrets.PRIVY_APP_SECRET }}
            PRIVY_VERIFICATION_KEY=${{ secrets.PRIVY_VERIFICATION_KEY }}
            WEBAUTHN_RP_ID=${{ vars.WEBAUTHN_RP_ID }}
            WEBAUTHN_RP_NAME=${{ vars.WEBAUTHN_RP_NAME }}
            WEBAUTHN_ORIGIN=${{ env.WEBAUTHN_ORIGIN_ESC }}
            WEBAUTHN_RELATED_ORIGINS=${{ env.WEBAUTHN_RELATED_ORIGINS_ESC }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
            PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID }}
            PLAID_PRODUCTION_SECRET=${{ secrets.PLAID_PRODUCTION_SECRET }}
            PLAID_REDIRECT_URI=${{ vars.PLAID_REDIRECT_URI || secrets.PLAID_REDIRECT_URI }}
            PLAID_WEBHOOK_URL=${{ vars.PLAID_WEBHOOK_URL || secrets.PLAID_WEBHOOK_URL }}
            DEBANK_ACCESS_KEY=${{ secrets.DEBANK_ACCESS_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PRICE_PRO_MONTHLY=${{ vars.STRIPE_PRICE_PRO_MONTHLY || secrets.STRIPE_PRICE_PRO_MONTHLY }}
            STRIPE_PRICE_PRO_YEARLY=${{ vars.STRIPE_PRICE_PRO_YEARLY || secrets.STRIPE_PRICE_PRO_YEARLY }}
            STRIPE_PRICE_ULTIMATE_MONTHLY=${{ vars.STRIPE_PRICE_ULTIMATE_MONTHLY || secrets.STRIPE_PRICE_ULTIMATE_MONTHLY }}
            STRIPE_PRICE_ULTIMATE_YEARLY=${{ vars.STRIPE_PRICE_ULTIMATE_YEARLY || secrets.STRIPE_PRICE_ULTIMATE_YEARLY }}
            BRIDGE_API_KEY=${{ secrets.BRIDGE_API_KEY }}
            BRIDGE_WEBHOOK_PUBLIC_KEY=${{ vars.BRIDGE_WEBHOOK_PUBLIC_KEY || secrets.BRIDGE_WEBHOOK_PUBLIC_KEY }}
            DINARI_API_KEY_ID=${{ secrets.DINARI_API_KEY_ID }}
            DINARI_API_SECRET_KEY=${{ secrets.DINARI_API_SECRET_KEY }}
            DINARI_ENVIRONMENT=${{ vars.DINARI_ENVIRONMENT }}
            DINARI_CHAIN_ID=${{ vars.DINARI_CHAIN_ID }}
            LIFI_INTEGRATOR=${{ env.LIFI_INTEGRATOR_ESC }}
            LIFI_API_KEY=${{ secrets.LIFI_API_KEY }}

      - name: Verify Cloud Run deployment
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy successful
        if: success()
        run: |
          echo "✅ Successfully deployed to Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Project: ${{ env.PROJECT_ID }}"
          echo "Image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      - name: Deploy failed
        if: failure()
        run: echo "❌ Deployment failed"
